name: Release Drafter
run-name: >-
  Release draft · ${{ github.event_name == 'workflow_dispatch' && inputs.package || 'changed' }}
on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
  workflow_dispatch:
    inputs:
      package:
        description: Package selector (all, package name, ".", or any workspace directory)
        required: true
        default: all
        type: string
      version-mode:
        description: Version mode
        required: true
        default: bump
        type: choice
        options:
          - bump
          - package-json
          - exact
      version-bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      exact-version:
        description: Exact version when version-mode is exact
        required: false
        default: ""
        type: string
      dry-run:
        description: Preview without creating or modifying release drafts
        required: true
        default: true
        type: boolean
permissions:
  contents: write
  pull-requests: read
jobs:
  dispatch-input-summary:
    name: "job: Workflow parameters"
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_dispatch-input-summary.yml@main
    with:
      parameters-json: ${{ github.event_name == 'workflow_dispatch' && toJSON(inputs) || '{}' }}
      heading: "release-draft · Run parameters"
  discover-packages:
    name: Discover publishable packages
    uses: moyarich/reusable-workflows/.github/workflows/reusable_discover-packages.yml@main
    with:
      packages-directory: packages
      use-workspaces: true
      require-publish-config: true

  discover:
    needs: discover-packages
    name: Discover changed packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select packages
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          PACKAGES_JSON: ${{ needs.discover-packages.outputs.packages }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' "$PACKAGES_JSON" > /tmp/packages.json

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_PACKAGE" = "all" ]; then
              SELECTED="$(cat /tmp/packages.json)"
            else
              SELECTED="$(
                jq -c --arg selector "$INPUT_PACKAGE" '
                  [.[] | select(.name == $selector or .directory == $selector)]
                ' /tmp/packages.json
              )"
            fi
          else
            if [ -n "$BEFORE_SHA" ] &&
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > /tmp/changed-files.txt
            else
              git diff-tree --root --no-commit-id --name-only -r "$AFTER_SHA" > /tmp/changed-files.txt
            fi

            SELECTED="$(
              jq -c --rawfile changed /tmp/changed-files.txt '
                ($changed | split("\n") | map(select(length > 0))) as $files
                | [
                    .[]
                    | . as $pkg
                    | select(
                        $files
                        | any(. == $pkg.directory or startswith($pkg.directory + "/"))
                      )
                  ]
              ' /tmp/packages.json
            )"
          fi

          # Drafts only: existing published GitHub Releases are immutable history.
          # A first npm publication does not require re-drafting its GitHub Release.
          BEFORE_FILTER="$(jq 'length' <<< "$SELECTED")"
          PUBLISHED_TAGS="$(
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -c '[.[][] | select(.draft == false) | .tag_name]'
          )"
          SELECTED="$(
            jq -cn --argjson packages "$SELECTED" --argjson tags "$PUBLISHED_TAGS" '
              [$packages[] | select((.directory + "@" + .version) as $tag | ($tags | index($tag)) == null)]
            '
          )"
          SKIPPED="$((BEFORE_FILTER - $(jq 'length' <<< "$SELECTED")))"
          if [ "$SKIPPED" -gt 0 ]; then
            echo "Skipping $SKIPPED packages with already-published GitHub Releases."
          fi

          COUNT="$(jq 'length' <<< "$SELECTED")"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] &&
             [ "$INPUT_PACKAGE" != "all" ] &&
             [ "$COUNT" -eq 0 ]; then
            echo "::error::Unknown package selector: $INPUT_PACKAGE"
            exit 1
          fi

          MATRIX="$(jq -cn --argjson packages "$SELECTED" '{include: $packages}')"

          {
            echo "matrix=$MATRIX"
            echo "count=$COUNT"
          } >> "$GITHUB_OUTPUT"

          {
            echo "# Package draft selection"
            echo
            echo "**$COUNT packages eligible for release drafting**"
            echo
            echo "$SKIPPED packages skipped because their exact GitHub Release tags are already published."
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Trigger | `%s` |\\n' "$EVENT_NAME"
            printf '| Package selector | `%s` |\\n' "${INPUT_PACKAGE:-changed packages}"
            echo
            echo "## Selected packages"
            echo
            echo "| Type | Package | Version | Directory |"
            echo "| --- | --- | --- | --- |"
            jq -r '.[] | [
              (if .directory == "packages/console-core" or .directory == "packages/console" then "Core" else "Addon" end),
              ("`" + .name + "`"),
              ("`" + .version + "`"),
              ("`" + .directory + "`")
            ] | "| " + join(" | ") + " |"' <<< "$SELECTED"
          } >> "$GITHUB_STEP_SUMMARY"

  draft:
    name: "Draft · ${{ matrix.name }}"
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: draft-package-${{ github.repository }}-${{ matrix.directory }}
      cancel-in-progress: true
    uses: moyarich/reusable-workflows/.github/workflows/reusable_release-drafter.yml@main
    with:
      target-branch: main
      version-mode: exact
      exact-version: ${{ matrix.version }}
      package-name: ${{ matrix.name }}
      package-directory: ${{ matrix.directory }}
      tag-prefix: ${{ format('{0}@', matrix.directory) }}
      target-key: ${{ matrix.directory }}
      release-name: ${{ format('{0} v{1}', matrix.name, matrix.version) }}
      changelog-path: ${{ format('{0}/CHANGELOG.md', matrix.directory) }}
      dry-run: false
