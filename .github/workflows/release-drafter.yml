name: Release Drafter . Draft package releases

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
  workflow_dispatch:
    inputs:
      package:
        description: Package selector (all, package name, or package directory)
        required: true
        default: all
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  discover:
    name: Discover changed packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select packages
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE' > /tmp/packages.json
          import fs from "node:fs";
          import path from "node:path";

          function walk(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const target = path.join(directory, entry.name);
              if (entry.isDirectory()) return walk(target);
              return entry.name === "package.json" ? [target] : [];
            });
          }

          const packages = walk("packages")
            .map((manifestPath) => {
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              return {
                name: manifest.name,
                version: manifest.version,
                directory: path.dirname(manifestPath).replaceAll("\\", "/"),
                private: manifest.private === true,
              };
            })
            .filter((pkg) => pkg.name && pkg.version && !pkg.private);

          process.stdout.write(JSON.stringify(packages));
          NODE

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_PACKAGE" = "all" ]; then
              SELECTED="$(cat /tmp/packages.json)"
            else
              SELECTED="$(
                jq -c --arg selector "$INPUT_PACKAGE" '
                  [.[] | select(.name == $selector or .directory == $selector)]
                ' /tmp/packages.json
              )"
            fi
          else
            if [ -n "$BEFORE_SHA" ] &&
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > /tmp/changed-files.txt
            else
              git diff-tree --root --no-commit-id --name-only -r "$AFTER_SHA" > /tmp/changed-files.txt
            fi

            SELECTED="$(
              jq -c --rawfile changed /tmp/changed-files.txt '
                ($changed | split("\n") | map(select(length > 0))) as $files
                | [
                    .[]
                    | . as $pkg
                    | select(
                        $files
                        | any(. == $pkg.directory or startswith($pkg.directory + "/"))
                      )
                  ]
              ' /tmp/packages.json
            )"
          fi

          COUNT="$(jq 'length' <<< "$SELECTED")"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] &&
             [ "$INPUT_PACKAGE" != "all" ] &&
             [ "$COUNT" -eq 0 ]; then
            echo "::error::Unknown package selector: $INPUT_PACKAGE"
            exit 1
          fi

          MATRIX="$(jq -cn --argjson packages "$SELECTED" '{include: $packages}')"

          {
            echo "matrix=$MATRIX"
            echo "count=$COUNT"
          } >> "$GITHUB_OUTPUT"

          {
            echo "# Package draft selection"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Trigger | `%s` |\n' "$EVENT_NAME"
            echo "| Selected packages | **$COUNT** |"
            echo
            echo '~~~json'
            jq . <<< "$SELECTED"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  draft:
    name: "Draft · ${{ matrix.name }}"
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: draft-package-${{ github.repository }}-${{ matrix.directory }}
      cancel-in-progress: true
    uses: moyarich/reusable-workflows/.github/workflows/reusable_release-drafter.yml@main
    with:
      target-branch: main
      version-mode: exact
      exact-version: ${{ matrix.version }}
      package-name: ${{ matrix.name }}
      package-directory: ${{ matrix.directory }}
      tag-prefix: ${{ format('{0}@', matrix.directory) }}
      target-key: ${{ matrix.directory }}
      release-name: ${{ format('{0} v{1}', matrix.name, matrix.version) }}
      changelog-path: ${{ format('{0}/CHANGELOG.md', matrix.directory) }}
      dry-run: false
