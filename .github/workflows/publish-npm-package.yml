name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Select one package directory, or all packages in dependency order
        required: true
        default: all
        type: choice
        options:
          - all
          - packages/console-core
          - packages/console
          - packages/addons/imperative-scrolling
          - packages/addons/data-export
          - packages/addons/diagnostics
          - packages/addons/filtering
          - packages/addons/markdown
          - packages/addons/annotations
          - packages/addons/navigation
          - packages/addons/selection
          - packages/addons/resizable
      dry-run:
        description: Preview publishing without changing the npm registry
        required: true
        default: true
        type: boolean
      tag:
        description: npm distribution tag (leave blank for the resolved default)
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  core:
    name: Publish packages/console-core
    if: ${{ inputs.package == 'all' || inputs.package == 'packages/console-core' }}
    permissions:
      contents: write
      packages: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@main
    with:
      target-branch: main
      package-directory: packages/console-core
      version-mode: package-json
      registry: npm
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      verify-git-tag: true
      node-version: "24"
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  console:
    name: Publish packages/console
    needs: core
    if: ${{ always() && !cancelled() && (needs.core.result == 'success' || needs.core.result == 'skipped') && (inputs.package == 'all' || inputs.package == 'packages/console') }}
    permissions:
      contents: write
      packages: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@main
    with:
      target-branch: main
      package-directory: packages/console
      version-mode: package-json
      registry: npm
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      verify-git-tag: true
      node-version: "24"
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  imperative_scrolling:
    name: Publish packages/addons/imperative-scrolling
    needs: console
    if: ${{ always() && !cancelled() && (needs.console.result == 'success' || needs.console.result == 'skipped') && (inputs.package == 'all' || inputs.package == 'packages/addons/imperative-scrolling') }}
    permissions:
      contents: write
      packages: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@main
    with:
      target-branch: main
      package-directory: packages/addons/imperative-scrolling
      version-mode: package-json
      registry: npm
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      verify-git-tag: true
      node-version: "24"
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  data_export:
    name: Publish packages/addons/data-export
    needs: imperative_scrolling
    if: ${{ always() && !cancelled() && (needs.imperative_scrolling.result == 'success' || needs.imperative_scrolling.result == 'skipped') && (inputs.package == 'all' || inputs.package == 'packages/addons/data-export') }}
    permissions:
      contents: write
      packages: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@main
    with:
      target-branch: main
      package-directory: packages/addons/data-export
      version-mode: package-json
      registry: npm
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      verify-git-tag: true
      node-version: "24"
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  diagnostics:
    name: Publish packages/addons/diagnostics
    needs: data_export
    if: ${{ always() && !cancelled() && (needs.data_export.result == 'success' || needs.data_export.result == 'skipped') && (inputs.package == 'all' || inputs.package == 'packages/addons/diagnostics') }}
    permissions:
      contents: write
      packages: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@main
    with:
      target-branch: main
      package-directory: packages/addons/diagnostics
      version-mode: package-json
      registry: npm
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      verify-git-tag: true
      node-version: "24"
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  filtering:
    name: Publish packages/addons/filtering
    needs: diagnostics
    if: ${{ always() && !cancelled() && (needs.diagnostics.result == 'success' || needs.diagnostics.result == 'skipped') && (inputs.package == 'all' || inputs.package == 'packages/addons/filtering') }}
    permissions:
      contents: write
      packages: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@main
    with:
      target-branch: main
      package-directory: packages/addons/filtering
      version-mode: package-json
      registry: npm
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      verify-git-tag: true
      node-version: "24"
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  markdown:
    name: Publish packages/addons/markdown
    needs: filtering
    if: ${{ always() && !cancelled() && (needs.selection.result == 'success' || needs.selection.result == 'skipped') && (inputs.package == 'all' || inputs.package == 'packages/addons/markdown') }}
    permissions:
      contents: write
      packages: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@main
    with:
      target-branch: main
      package-directory: packages/addons/markdown
      version-mode: package-json
      registry: npm
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      verify-git-tag: true
      node-version: "24"
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  annotations:
    name: Publish packages/addons/annotations
    needs: markdown
    if: ${{ always() && !cancelled() && (needs.markdown.result == 'success' || needs.markdown.result == 'skipped') && (inputs.package == 'all' || inputs.package == 'packages/addons/annotations') }}
    permissions:
      contents: write
      packages: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@main
    with:
      target-branch: main
      package-directory: packages/addons/annotations
      version-mode: package-json
      registry: npm
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      verify-git-tag: true
      node-version: "24"
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  navigation:
    name: Publish packages/addons/navigation
    needs: annotations
    if: ${{ always() && !cancelled() && (needs.annotations.result == 'success' || needs.annotations.result == 'skipped') && (inputs.package == 'all' || inputs.package == 'packages/addons/navigation') }}
    permissions:
      contents: write
      packages: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@main
    with:
      target-branch: main
      package-directory: packages/addons/navigation
      version-mode: package-json
      registry: npm
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      verify-git-tag: true
      node-version: "24"
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  selection:
    name: Publish packages/addons/selection
    needs: navigation
    if: ${{ always() && !cancelled() && (needs.navigation.result == 'success' || needs.navigation.result == 'skipped') && (inputs.package == 'all' || inputs.package == 'packages/addons/selection') }}
    permissions:
      contents: write
      packages: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@main
    with:
      target-branch: main
      package-directory: packages/addons/selection
      version-mode: package-json
      registry: npm
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      verify-git-tag: true
      node-version: "24"
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  resizable:
    name: Publish packages/addons/resizable
    needs: selection
    if: ${{ always() && !cancelled() && (needs.filtering.result == 'success' || needs.filtering.result == 'skipped') && (inputs.package == 'all' || inputs.package == 'packages/addons/resizable') }}
    permissions:
      contents: write
      packages: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@main
    with:
      target-branch: main
      package-directory: packages/addons/resizable
      version-mode: package-json
      registry: npm
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      verify-git-tag: true
      node-version: "24"
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

