name: Publish npm package

run-name: >-
  Publish · ${{ inputs.package }} · ${{ inputs.registry }} · ${{ inputs.version-mode }}${{ inputs.version-mode == 'exact' && format(':{0}', inputs.exact-version) || '' }} · dry-run=${{ inputs.dry-run }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory to publish, or all packages
        required: true
        type: choice
        options:
          - all
          - packages/console-core
          - packages/console
          - packages/addons/animation
          - packages/addons/annotations
          - packages/addons/console-feed
          - packages/addons/data-export
          - packages/addons/diagnostics
          - packages/addons/filtering
          - packages/addons/imperative-scrolling
          - packages/addons/links
          - packages/addons/markdown
          - packages/addons/metadata
          - packages/addons/navigation
          - packages/addons/process-state
          - packages/addons/resizable
          - packages/addons/search
          - packages/addons/selection
          - packages/addons/session
          - packages/addons/xterm
      registry:
        description: Publish destination
        required: true
        default: npm
        type: choice
        options:
          - npm
          - github
          - all
      version-mode:
        description: Publish manifest version or an exact version
        required: true
        default: package-json
        type: choice
        options: [package-json, exact]
      exact-version:
        description: Version when using exact mode
        required: false
        default: ""
        type: string
      verify-git-tag:
        description: Require matching package Git tag before publishing
        required: true
        default: true
        type: boolean
      node-version:
        description: Node.js version for publishing
        required: true
        default: "24"
        type: string
      dry-run:
        description: Preview publishing without changing the npm registry
        required: true
        default: true
        type: boolean
      tag:
        description: npm distribution tag (leave empty to use the resolved default)
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  discover-packages:
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_discover-packages.yml@v0
    with:
      packages-directory: packages
      use-workspaces: true
      require-publish-config: true

  select-packages:
    needs: discover-packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
      core: ${{ steps.select.outputs.core }}
      console: ${{ steps.select.outputs.console }}
      addons: ${{ steps.select.outputs.addons }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: select
        env:
          SELECTOR: ${{ inputs.package }}
          PACKAGES_JSON: ${{ needs.discover-packages.outputs.packages }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SELECTOR" = "all" ]; then
            SELECTED="$PACKAGES_JSON"
          else
            SELECTED="$(jq -cn --argjson packages "$PACKAGES_JSON" --arg selector "$SELECTOR" '[ $packages[] | select(.directory == $selector or .name == $selector) ]')"
          fi
          # Resolve dependencies for validation and stage selection; publish jobs enforce core → console → addons.
          SELECTED="$(SELECTED="$SELECTED" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const selected = JSON.parse(process.env.SELECTED);
          const byName = new Map(selected.map(pkg => [pkg.name, pkg]));
          const done = new Set(), visiting = new Set(), sorted = [];
          function visit(pkg) {
            if (done.has(pkg.name)) return;
            if (visiting.has(pkg.name)) throw new Error(`Workspace dependency cycle: ${pkg.name}`);
            visiting.add(pkg.name);
            const manifest = JSON.parse(readFileSync(`${pkg.directory}/package.json`, 'utf8'));
            const dependencies = { ...manifest.dependencies, ...manifest.optionalDependencies, ...manifest.peerDependencies };
            for (const name of Object.keys(dependencies).sort()) {
              const dependency = byName.get(name);
              if (dependency) visit(dependency);
            }
            visiting.delete(pkg.name);
            done.add(pkg.name);
            sorted.push(pkg);
          }
          for (const pkg of selected) visit(pkg);
          process.stdout.write(JSON.stringify(sorted));
          NODE
          )"
          COUNT="$(jq 'length' <<< "$SELECTED")"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No publishable packages matched $SELECTOR"
            exit 1
          fi
          {
            echo "matrix=$(jq -cn --argjson packages "$SELECTED" '{include:$packages}')"
            echo "count=$COUNT"
            echo "core=$(jq -cn --argjson packages "$SELECTED" '{include: [$packages[] | select(.directory == "packages/console-core")]}' )"
            echo "console=$(jq -cn --argjson packages "$SELECTED" '{include: [$packages[] | select(.directory == "packages/console")]}' )"
            echo "addons=$(jq -cn --argjson packages "$SELECTED" '{include: [$packages[] | select(.directory != "packages/console-core" and .directory != "packages/console")]}' )"
          } >> "$GITHUB_OUTPUT"
          {
            echo "# Package publishing selection"
            echo
            echo "**$COUNT publishable packages selected**"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Package selector | `%s` |\\n' "$SELECTOR"
            printf '| Registry | `%s` |\\n' "${{ inputs.registry }}"
            printf '| Version mode | `%s` |\\n' "${{ inputs.version-mode }}"
            printf '| Dry run | `%s` |\\n' "${{ inputs.dry-run }}"
            echo
            echo "## Publish order"
            echo
            echo "Console Core → Console → addons (dependency stages)"
            echo
            echo "| Stage | Package | Version | Directory |"
            echo "| --- | --- | --- | --- |"
            jq -r '.[] | [
              (if .directory == "packages/console-core" then "1 · Core" elif .directory == "packages/console" then "2 · Console" else "3 · Addon" end),
              ("`" + .name + "`"),
              ("`" + .version + "`"),
              ("`" + .directory + "`")
            ] | "| " + join(" | ") + " |"' <<< "$SELECTED"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-core:
    name: Publish · ${{ matrix.name }}
    needs: select-packages
    if: github.ref == 'refs/heads/main' && fromJSON(needs.select-packages.outputs.core).include[0] != null
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select-packages.outputs.core) }}
    concurrency:
      group: npm-publish-${{ github.repository }}-${{ matrix.directory }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@v0
    with:
      target-branch: main
      package-directory: ${{ matrix.directory }}
      version-mode: ${{ inputs.version-mode }}
      exact-version: ${{ inputs.exact-version }}
      registry: ${{ inputs.registry }}
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      verify-git-tag: ${{ inputs.verify-git-tag }}
      node-version: ${{ inputs.node-version }}
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}
  publish-console:
    name: Publish · ${{ matrix.name }}
    needs: [select-packages, publish-core]
    if: always() && github.ref == 'refs/heads/main' && needs.select-packages.result == 'success' && (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped') && fromJSON(needs.select-packages.outputs.console).include[0] != null
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select-packages.outputs.console) }}
    concurrency:
      group: npm-publish-${{ github.repository }}-${{ matrix.directory }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@v0
    with:
      target-branch: main
      package-directory: ${{ matrix.directory }}
      version-mode: ${{ inputs.version-mode }}
      exact-version: ${{ inputs.exact-version }}
      registry: ${{ inputs.registry }}
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      verify-git-tag: ${{ inputs.verify-git-tag }}
      node-version: ${{ inputs.node-version }}
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}
  publish-addons:
    name: Publish · ${{ matrix.name }}
    needs: [select-packages, publish-core, publish-console]
    if: always() && github.ref == 'refs/heads/main' && needs.select-packages.result == 'success' && (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped') && (needs.publish-console.result == 'success' || needs.publish-console.result == 'skipped') && fromJSON(needs.select-packages.outputs.addons).include[0] != null
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select-packages.outputs.addons) }}
    concurrency:
      group: npm-publish-${{ github.repository }}-${{ matrix.directory }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-publish.yml@v0
    with:
      target-branch: main
      package-directory: ${{ matrix.directory }}
      version-mode: ${{ inputs.version-mode }}
      exact-version: ${{ inputs.exact-version }}
      registry: ${{ inputs.registry }}
      dry-run: ${{ inputs.dry-run }}
      tag: ${{ inputs.tag }}
      verify-git-tag: ${{ inputs.verify-git-tag }}
      node-version: ${{ inputs.node-version }}
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}
