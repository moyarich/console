name: Emulate release PR merge

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Console release PR number to emulate
        type: string
        required: true
        default: "225"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: emulate-release-pr-${{ github.event.pull_request.number || inputs.pr-number || github.run_id }}
  cancel-in-progress: true

jobs:
  emulate:
    name: Emulate PR merge and draft release
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 225 && startsWith(github.event.pull_request.head.ref, 'release/prepare-') && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.pr-number == '225') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out emulator implementation
        uses: actions/checkout@v4
        with:
          repository: moyarich/github_emulator
          ref: feat/emulate-pr-merge-flow-20261031
          persist-credentials: false
      - name: Emulate Console release PR merge
        uses: moyarich/github_emulator@feat/emulate-pr-merge-flow-20261031
        with:
          repository: moyarich/console
          pr-number: ${{ github.event.pull_request.number || inputs.pr-number }}
          workflow: .github/workflows/release-approved-pr.yml
          github-token: ${{ github.token }}
