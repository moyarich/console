name: Self-heal formatting

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Commit formatting changes
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: self-heal-format-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    uses: moyarich/reusable-workflows/.github/workflows/reusable_prettier.yml@main
    with:
      mode: fix
      prettier-config: this-repository
      commit: ${{ github.event_name == 'workflow_run' || inputs.commit }}
      node-version: "24"
