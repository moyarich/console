name: Self-heal formatting

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      commit:
        description: Commit formatting changes
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: self-heal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          # The default GitHub App token cannot push edits to .github/workflows.
          # Supply a workflow-authorized token when automatic workflow repairs are needed.
          token: ${{ secrets.WORKFLOW_TOKEN || github.token }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Format repository with prettier
        id: format
        run: |
          npm run format

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify formatting
        run: npm run format:check

      - name: Commit formatting repair
        id: repair
        env:
          WORKFLOW_TOKEN_AVAILABLE: ${{ secrets.WORKFLOW_TOKEN != '' && 'true' || '' }}
          TARGET_BRANCH: ${{ github.ref_name }}
        if: >-
          ${{ steps.format.outputs.changed == 'true' &&
              (github.event_name == 'push' || inputs.commit) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set -euo pipefail

          git add --all

          # GitHub refuses workflow-file updates from an App token without
          # workflow-editing permission. Avoid failing a source-only repair
          # simply because a workflow file was also reformatted.
          if [ -z "${WORKFLOW_TOKEN_AVAILABLE}" ]; then
            if git diff --cached --name-only -- .github/workflows/ | grep -q .; then
              echo "::warning::Formatting changes to .github/workflows need a WORKFLOW_TOKEN secret with workflow-editing permission."
              git restore --staged -- .github/workflows/
              echo "workflow-changes-skipped=true" >> "$GITHUB_OUTPUT"
            fi
          fi

          if git diff --cached --quiet; then
            if git diff --name-only -- .github/workflows/ | grep -q .; then
              echo "::error::Workflow formatting needs a WORKFLOW_TOKEN secret with workflow-editing permission."
              exit 1
            fi
            echo "No committable formatting changes."
            exit 0
          fi

          git commit -m "style: self-heal formatting"
          git push origin "HEAD:${TARGET_BRANCH}"

          if git diff --name-only -- .github/workflows/ | grep -q .; then
            echo "::error::Some workflow formatting changes remain; configure WORKFLOW_TOKEN to commit them."
            exit 1
          fi

      - name: Summary
        if: ${{ always() }}
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          CHANGES_DETECTED: ${{ steps.format.outputs.changed || 'unknown' }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "# Self-heal formatting"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Branch | `%s` |\n' "$BRANCH_NAME"
            printf '| Changes detected | **%s** |\n' "$CHANGES_DETECTED"
            printf '| Result | **%s** |\n' "$RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
