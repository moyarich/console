name: Format Anser integration

on:
  push:
    branches:
      - feature/console-enhancements

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feature/console-enhancements
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --include=optional
      - run: npx prettier --write packages/console/src/index.ts README.md
      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/format-anser-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/console/src/index.ts README.md .github/workflows/format-anser-integration.yml
          git commit -m "style: format anser integration"
          git push origin HEAD:feature/console-enhancements
