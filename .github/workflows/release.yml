name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Console package-family version to release
        required: true
        default: "0.1.0"
        type: string
      dry-run:
        description: Validate the release without creating tags, packages, or releases
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Console ${{ inputs.version }}
    runs-on: ubuntu-latest
    environment: release

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"

      - name: Validate package-family version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module - "$REQUESTED_VERSION" <<'NODE'
          import fs from "node:fs";

          const requested = process.argv[2];
          const manifests = [
            "packages/console-core/package.json",
            "packages/console/package.json",
            "packages/addons/imperative-scrolling/package.json",
            "packages/addons/data-export/package.json",
            "packages/addons/diagnostics/package.json",
            "packages/addons/filtering/package.json",
            "packages/addons/resizable/package.json",
          ];

          for (const manifest of manifests) {
            const pkg = JSON.parse(fs.readFileSync(manifest, "utf8"));
            if (pkg.version !== requested) {
              console.error(
                `::error::${pkg.name} is ${pkg.version}; requested release is ${requested}.`,
              );
              process.exitCode = 1;
            }
          }
          NODE

          TAG="v$REQUESTED_VERSION"
          RELEASE_NAME="@moyarich/console v$REQUESTED_VERSION"

          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release-name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            HEAD_SHA="$(git rev-parse HEAD)"
            if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
              echo "::error::$TAG already exists on $TAG_SHA, not HEAD $HEAD_SHA."
              exit 1
            fi
            echo "tag-exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag-exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm ci --include=optional

      - name: Validate repository
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm test
          npm run build:packages
          npm run pack:packages

      - name: Check package registry state
        id: registry
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            "@moyarich/console-core"
            "@moyarich/console"
            "@moyarich/console-addon-imperative-scrolling"
            "@moyarich/console-addon-data-export"
            "@moyarich/console-addon-diagnostics"
            "@moyarich/console-addon-filtering"
            "@moyarich/console-addon-resizable"
          )

          all_published=true
          {
            echo "## Package registry state"
            echo
            echo "| Package | $VERSION |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for package in "${packages[@]}"; do
            if npm view "$package@$VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              status="published"
            else
              status="missing"
              all_published=false
            fi

            echo "| `$package` | **$status** |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "all-published=$all_published" >> "$GITHUB_OUTPUT"

      - name: Resolve existing GitHub Release
        id: existing-release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE="$(
            gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100"               | jq -c --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | first // empty'
          )"

          if [ -z "$RELEASE" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "id=$(jq -r '.id' <<< "$RELEASE")" >> "$GITHUB_OUTPUT"
          echo "draft=$(jq -r '.draft' <<< "$RELEASE")" >> "$GITHUB_OUTPUT"

          if [ "$(jq -r '.draft' <<< "$RELEASE")" != "true" ]; then
            echo "::error::A published GitHub Release already exists for $TAG."
            exit 1
          fi

      - name: Release preview
        if: ${{ inputs.dry-run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: ${{ steps.version.outputs.release-name }}
        shell: bash
        run: |
          {
            echo "## Release preview"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Package family | `@moyarich/console` |"
            echo "| Version | `$VERSION` |"
            echo "| Git tag | `$TAG` |"
            echo "| Release name | `$RELEASE_NAME` |"
            echo "| Existing draft | **${{ steps.existing-release.outputs.exists }}** |"
            echo "| Tag already exists | **${{ steps.version.outputs.tag-exists }}** |"
            echo "| All packages already published | **${{ steps.registry.outputs.all-published }}** |"
            echo
            echo "Dry run made no release mutations."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update GitHub Release draft
        id: draft
        if: ${{ !inputs.dry-run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: ${{ steps.version.outputs.release-name }}
        shell: bash
        run: |
          set -euo pipefail

          NOTES="$(
            awk '
              $0 == "## " ENVIRON["VERSION"] { capture=1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md
          )"

          if [ -z "$NOTES" ]; then
            echo "::error::CHANGELOG.md has no public release notes for $VERSION."
            exit 1
          fi

          BODY="$(
            {
              echo "## Release notes"
              echo
              echo "$NOTES"
              echo
              echo "## Install"
              echo
              echo '~~~sh'
              echo "npm install @moyarich/console@$VERSION"
              echo '~~~'
            }
          )"

          if [ "${{ steps.existing-release.outputs.exists }}" = "true" ]; then
            RELEASE="$(
              gh api --method PATCH                 "repos/$GH_REPO/releases/${{ steps.existing-release.outputs.id }}"                 -f tag_name="$TAG"                 -f target_commitish="main"                 -f name="$RELEASE_NAME"                 -f body="$BODY"                 -F draft=true
            )"
            ACTION="updated"
          else
            RELEASE="$(
              gh api --method POST                 "repos/$GH_REPO/releases"                 -f tag_name="$TAG"                 -f target_commitish="main"                 -f name="$RELEASE_NAME"                 -f body="$BODY"                 -F draft=true
            )"
            ACTION="created"
          fi

          echo "id=$(jq -r '.id' <<< "$RELEASE")" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Create and push Git tag
        if: ${{ !inputs.dry-run && steps.version.outputs.tag-exists == 'false' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "@moyarich/console $VERSION"
          git push origin "$TAG"

      - name: Publish missing GitHub Packages
        if: ${{ !inputs.dry-run }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            "@moyarich/console-core"
            "@moyarich/console"
            "@moyarich/console-addon-imperative-scrolling"
            "@moyarich/console-addon-data-export"
            "@moyarich/console-addon-diagnostics"
            "@moyarich/console-addon-filtering"
            "@moyarich/console-addon-resizable"
          )

          for package in "${packages[@]}"; do
            if npm view "$package@$VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "$package@$VERSION already exists; skipping."
              continue
            fi

            npm publish --workspace "$package" --registry=https://npm.pkg.github.com
          done

      - name: Verify published package family
        id: verify
        if: ${{ !inputs.dry-run }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            "@moyarich/console-core"
            "@moyarich/console"
            "@moyarich/console-addon-imperative-scrolling"
            "@moyarich/console-addon-data-export"
            "@moyarich/console-addon-diagnostics"
            "@moyarich/console-addon-filtering"
            "@moyarich/console-addon-resizable"
          )

          for package in "${packages[@]}"; do
            npm view "$package@$VERSION" version --registry=https://npm.pkg.github.com >/dev/null
          done

          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: ${{ !inputs.dry-run && steps.verify.outputs.published == 'true' }}
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id || steps.existing-release.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE="$(
            gh api --method PATCH               "repos/$GH_REPO/releases/$RELEASE_ID"               -F draft=false
          )"

          if [ "$(jq -r '.draft' <<< "$RELEASE")" != "false" ]; then
            echo "::error::GitHub Release remained in draft state."
            exit 1
          fi

      - name: Release summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## Console release"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Version | `${{ steps.version.outputs.version || 'unresolved' }}` |"
            echo "| Tag | `${{ steps.version.outputs.tag || 'unresolved' }}` |"
            echo "| Dry run | **${{ inputs.dry-run }}** |"
            echo "| Draft action | **${{ steps.draft.outputs.action || 'none' }}** |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
