name: ESM Runner Format Preview

on:
  push:
    branches:
      - fix/carriage-return-progress-output

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm install --include=optional
      - run: npx prettier apps/playground/src/components/RunnableExample/compileExampleSource.ts
