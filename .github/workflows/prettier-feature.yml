name: Format feature branch with Prettier

on:
  push:
    branches:
      - feature/console-event-channel

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Format changed files
        shell: bash
        run: |
          git fetch origin main
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR origin/main...HEAD --               '*.js' '*.jsx' '*.ts' '*.tsx' '*.css' '*.json'               '*.md' '*.html' '*.yml' '*.yaml'
          )

          existing=()
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              existing+=("$file")
            fi
          done

          if (( ${#existing[@]} > 0 )); then
            npx --yes prettier@3.6.2 --write "${existing[@]}"
          fi

      - name: Commit formatting
        shell: bash
        run: |
          rm -f .github/workflows/prettier-feature.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "style: format changed files with prettier"
          git push origin HEAD:feature/console-event-channel
