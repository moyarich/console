name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --include=optional
      - name: Lint
        run: npm run lint
      - name: Capture formatting fixes
        run: |
          npx prettier --write \
            apps/playground/src/examples/50-additional-usage/15-addons/example.tsx \
            packages/console/src/addons.ts \
            packages/console/src/hooks/useConsoleAddons.ts \
            README.md \
            tests/addons.test.tsx
          git diff -- \
            apps/playground/src/examples/50-additional-usage/15-addons/example.tsx \
            packages/console/src/addons.ts \
            packages/console/src/hooks/useConsoleAddons.ts \
            README.md \
            tests/addons.test.tsx
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build package and playground
        run: npm run build
      - name: Build Storybook
        run: npm run build-storybook
      - name: Validate package archive
        run: npm pack --workspace @moyarich/console --dry-run
