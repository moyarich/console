name: Release approved preparation PR

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Merged release preparation PR number (for example, 225)'
        required: true
        type: string

permissions: {}

jobs:
  release-input-summary:
    name: Approved release inputs
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/prepare-')) || (github.event_name == 'workflow_dispatch' && inputs.pr-number != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate selected merged PR
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" | jq -e --arg repo "$GH_REPO" '
            .merged == true and .state == "closed" and .base.ref == "main" and
            .head.repo.full_name == $repo and (.head.ref | startswith("release/prepare-")) and
            (.merge_commit_sha | type == "string" and test("^[a-f0-9]{40}$"))
          ' > /dev/null
      - name: Summarize release inputs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
          PR_TITLE: ${{ github.event.pull_request.title || 'Manually selected approved release PR' }}
          PR_URL: ${{ github.event.pull_request.html_url || format('https://github.com/{0}/pull/{1}', github.repository, inputs.pr-number) }}
          PR_HEAD: ${{ github.event.pull_request.head.ref || 'Validated via GitHub API' }}
          PR_BASE: ${{ github.event.pull_request.base.ref || 'main' }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || 'Validated via GitHub API' }}
          APPROVED_WORKFLOW: moyarich/reusable-workflows/.github/workflows/reusable_approved-release.yml@main
          EXPECTED_BASE: main
          DRY_RUN: "false"
        run: |
          {
            echo "## Approved release inputs"
            echo
            echo "| Input | Value |"
            echo "| --- | --- |"
            echo "| Pull request | [#${PR_NUMBER}](${PR_URL}) |"
            echo "| Title | ${PR_TITLE//|/\\|} |"
            echo "| Source branch | \`${PR_HEAD}\` |"
            echo "| Expected base | \`${EXPECTED_BASE}\` |"
            echo "| Actual base | \`${PR_BASE}\` |"
            echo "| Merge commit | \`${MERGE_SHA}\` |"
            echo "| Reusable workflow | \`${APPROVED_WORKFLOW}\` |"
            echo "| Dry run | \`${DRY_RUN}\` |"
            echo
            echo "The reusable workflow verifies the merged package selection and writes draft-release summaries in its own jobs."
          } >> "$GITHUB_STEP_SUMMARY"

  approved-release:
    name: Verify and release approved packages
    needs: release-input-summary
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/prepare-')) || (github.event_name == 'workflow_dispatch' && inputs.pr-number != '') }}
    permissions:
      contents: write
      packages: write
      checks: read
      actions: write
      statuses: read
      pull-requests: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_approved-release.yml@main
    with:
      expected-base: main
      pr-number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr-number || '' }}
      dry-run: false
    secrets:
      npm-token: ${{ secrets._NPM_TOKEN }}
