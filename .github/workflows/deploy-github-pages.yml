name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  pages:
    name: Build and deploy playground
    uses: moyarich/reusable-workflows/.github/workflows/reusable_github-pages.yml@main
    with:
      node-version: "24"
      install-command: npm ci --include=optional
      build-command: VITE_BASE_PATH="${PAGES_BASE_PATH}/" MOYAFORGE_BASE_PATH="${PAGES_BASE_PATH}/" npm run build:playground
      output-directory: apps/playground/dist
