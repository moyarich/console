name: Publish GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-github-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"
      - name: Install dependencies
        run: npm ci --include=optional
      - name: Validate publishable packages
        run: npm run typecheck && npm test && npm run build:packages && npm run pack:packages
      - name: Show package versions
        run: |
          node -p "'Publishing @moyarich/console-core@' + require('./packages/console-core/package.json').version"
          node -p "'Publishing @moyarich/console@' + require('./packages/console/package.json').version"
          node -p "'Publishing @moyarich/console-addon-imperative-scrolling@' + require('./packages/addons/imperative-scrolling/package.json').version"
          node -p "'Publishing @moyarich/console-addon-data-export@' + require('./packages/addons/data-export/package.json').version"
          node -p "'Publishing @moyarich/console-addon-diagnostics@' + require('./packages/addons/diagnostics/package.json').version"
          node -p "'Publishing @moyarich/console-addon-filtering@' + require('./packages/addons/filtering/package.json').version"
          node -p "'Publishing @moyarich/console-addon-resizable@' + require('./packages/addons/resizable/package.json').version"
      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for workspace in             @moyarich/console-core             @moyarich/console             @moyarich/console-addon-imperative-scrolling             @moyarich/console-addon-data-export             @moyarich/console-addon-diagnostics             @moyarich/console-addon-filtering             @moyarich/console-addon-resizable
          do
            npm publish --workspace "$workspace"
          done
