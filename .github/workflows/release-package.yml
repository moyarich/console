name: Release package

on:
  workflow_dispatch:
    inputs:
      package:
        description: all, package name, or package directory
        required: true
        default: all
        type: string
      dry-run:
        description: Validate without creating a GitHub Release, tag, or package
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-package-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  discover-packages:
    name: Discover publishable packages
    uses: moyarich/reusable-workflows/.github/workflows/reusable_discover-packages.yml@v0
    with:
      packages-directory: packages
      use-workspaces: true
      require-publish-config: true

  select:
    name: Resolve release selection
    needs: discover-packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.package.outputs.matrix }}
      count: ${{ steps.package.outputs.count }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Select packages
        id: package
        env:
          SELECTOR: ${{ inputs.package }}
          PACKAGES_JSON: ${{ needs.discover-packages.outputs.packages }}
        shell: bash
        run: |
          set -euo pipefail
          SELECTED="$(jq -cn --argjson packages "$PACKAGES_JSON" --arg selector "$SELECTOR" '
            if $selector == "all" then $packages
            else [$packages[] | select(.name == $selector or .directory == $selector)] end
          ')"
          COUNT="$(jq 'length' <<< "$SELECTED")"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No publishable packages matched $SELECTOR"
            exit 1
          fi
          {
            echo "matrix=$(jq -cn --argjson packages "$SELECTED" '{include: $packages}')"
            echo "count=$COUNT"
          } >> "$GITHUB_OUTPUT"
          echo "Selected $COUNT publishable packages" >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: Validate package release
    needs: select
    if: ${{ needs.select.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      # Repository-wide lint, formatting, tests and typechecking already run in CI.
      # Only validate the selected package artifact at release time.
      - name: Build and pack selected package
        env:
          PACKAGE_NAME: ${{ matrix.name }}
        run: |
          npm run build --workspace "$PACKAGE_NAME"
          npm pack --workspace "$PACKAGE_NAME" --dry-run

  release:
    name: GitHub package release
    needs: [select, gate]
    if: ${{ needs.select.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    permissions:
      contents: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_release.yml@v0
    with:
      version: ${{ matrix.version }}
      release-tag: ${{ format('{0}@{1}', matrix.directory, matrix.version) }}
      release-name: ${{ format('{0} v{1}', matrix.name, matrix.version) }}
      changelog-file: ${{ format('{0}/CHANGELOG.md', matrix.directory) }}
      target-ref: main
      create-tag: true
      draft: false
      dry-run: ${{ inputs.dry-run }}
