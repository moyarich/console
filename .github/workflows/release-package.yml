name: Release package

run-name: >-
  Release · ${{ inputs.package }} · ${{ inputs.version-mode }}${{ inputs.version-mode == 'bump' && format(':{0}', inputs.version-bump) || inputs.version-mode == 'exact' && format(':{0}', inputs.exact-version) || '' }} · ${{ inputs.draft && 'draft' || 'published' }} · dry-run=${{ inputs.dry-run }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: all, package name, or package directory
        required: true
        default: all
        type: string
      version-mode:
        description: Resolve each package version
        type: choice
        required: true
        default: package-json
        options: [auto, bump, package-json, exact]
      initial-version:
        description: Initial release version for auto mode
        type: string
        required: true
        default: "0.1.0"
      version-bump:
        description: SemVer increment for bump mode
        type: choice
        required: true
        default: patch
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
      exact-version:
        description: Version for exact mode (all selected packages)
        type: string
        required: false
        default: ""
      update-major-tag:
        description: Update package-scoped major compatibility alias
        type: boolean
        required: true
        default: true
      draft:
        description: Keep the GitHub Releases in draft state
        type: boolean
        required: true
        default: false
      dry-run:
        description: Validate without creating a GitHub Release, tag, or package
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-package-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  discover-packages:
    name: Discover publishable packages
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_discover-packages.yml@v0
    with:
      packages-directory: packages
      use-workspaces: true
      require-publish-config: true

  select:
    name: Resolve release selection
    needs: discover-packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.package.outputs.matrix }}
      count: ${{ steps.package.outputs.count }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Select packages
        id: package
        env:
          SELECTOR: ${{ inputs.package }}
          PACKAGES_JSON: ${{ needs.discover-packages.outputs.packages }}
          VERSION_MODE: ${{ inputs.version-mode }}
          VERSION_BUMP: ${{ inputs.version-bump }}
          EXACT_VERSION: ${{ inputs.exact-version }}
          INITIAL_VERSION: ${{ inputs.initial-version }}
        shell: bash
        run: |
          set -euo pipefail
          SELECTED="$(jq -cn --argjson packages "$PACKAGES_JSON" --arg selector "$SELECTOR" '
            if $selector == "all" then $packages
            else [$packages[] | select(.name == $selector or .directory == $selector)] end
          ')"
          SELECTED="$(SELECTED="$SELECTED" node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const selected=JSON.parse(process.env.SELECTED);
          const valid=v=>/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(v);
          function bump(version, kind) {
            const match=version.match(/^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?/);
            if (!match) throw Error("Invalid current version: "+version);
            let major=+match[1],minor=+match[2],patch=+match[3],pre=match[4];
            if(kind==="major") return `${major+1}.0.0`;
            if(kind==="minor") return `${major}.${minor+1}.0`;
            if(kind==="patch") return `${major}.${minor}.${patch+1}`;
            if(kind==="premajor") return `${major+1}.0.0-0`;
            if(kind==="preminor") return `${major}.${minor+1}.0-0`;
            if(kind==="prepatch") return `${major}.${minor}.${patch+1}-0`;
            if(kind==="prerelease") {
              if(!pre) return `${major}.${minor}.${patch+1}-0`;
              const parts=pre.split("."),last=parts.at(-1);
              if(/^\d+$/.test(last)) parts[parts.length-1]=String(+last+1);
              else parts.push("0");
              return `${major}.${minor}.${patch}-${parts.join(".")}`;
            }
            throw Error("Unsupported bump: "+kind);
          }
          const packages=selected.map(pkg=>{
            const current=pkg.version;
            let version=current;
            if(process.env.VERSION_MODE==="exact") version=process.env.EXACT_VERSION;
            if(process.env.VERSION_MODE==="bump") version=bump(current,process.env.VERSION_BUMP);
            if(process.env.VERSION_MODE==="auto") {
              const tags=execFileSync("git",["tag","-l",pkg.directory+"@*"],{encoding:"utf8"}).split("\n").map(x=>x.trim()).filter(Boolean);
              const previous=tags.map(tag=>tag.slice(pkg.directory.length+1)).filter(valid).filter(v=>!v.includes("-")).sort((a,b)=>{
                const x=a.split(".").map(Number),y=b.split(".").map(Number);
                for(let i=0;i<3;i++) if(x[i]!==y[i]) return x[i]-y[i];
                return 0;
              }).at(-1);
              version=previous?bump(previous,"patch"):process.env.INITIAL_VERSION;
            }
            if(!valid(version)) throw Error("Invalid resolved SemVer for "+pkg.name+": "+version);
            return {...pkg,currentVersion:current,version,major:version.split(".")[0]};
          });
          process.stdout.write(JSON.stringify(packages));
          NODE
          )"
          COUNT="$(jq 'length' <<< "$SELECTED")"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No publishable packages matched $SELECTOR"
            exit 1
          fi
          {
            echo "matrix=$(jq -cn --argjson packages "$SELECTED" '{include: $packages}')"
            echo "count=$COUNT"
          } >> "$GITHUB_OUTPUT"
          {
            echo "# Package release selection"
            echo
            echo "**$COUNT publishable packages selected**"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Package selector | `%s` |\n' "$SELECTOR"
            printf '| Version mode | `%s` |\n' "$VERSION_MODE"
            printf '| Dry run | `%s` |\n' "${{ inputs.dry-run }}"
            echo
            echo "## Packages"
            echo
            echo "| Type | Package | Current version | Release version |"
            echo "| --- | --- | --- | --- |"
            jq -r '.[] | [
              (if .directory == "packages/console-core" or .directory == "packages/console" then "Core" else "Addon" end),
              ("`" + .name + "`"),
              ("`" + .currentVersion + "`"),
              ("`" + .version + "`")
            ] | "| " + join(" | ") + " |"' <<< "$SELECTED"
          } >> "$GITHUB_STEP_SUMMARY"

  prepare-versions:
    name: Prepare package versions
    needs: select
    if: ${{ !inputs.dry-run && inputs.version-mode != 'package-json' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Update selected manifests and lockfile
        env:
          PACKAGES: ${{ needs.select.outputs.matrix }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGES="$PACKAGES" node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const selected=JSON.parse(process.env.PACKAGES).include;
          for(const pkg of selected) {
            execFileSync("npm",["pkg","set",`version=${pkg.version}`,"--workspace",pkg.name],{stdio:"inherit"});
          }
          NODE
          npm install --package-lock-only --ignore-scripts --include=optional
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages package-lock.json
            git commit -m "release: prepare selected package versions"
            git push origin HEAD:main
          fi

  gate:
    name: Validate package release
    needs: [select, prepare-versions]
    if: ${{ always() && needs.select.result == 'success' && (needs.prepare-versions.result == 'success' || needs.prepare-versions.result == 'skipped') && needs.select.outputs.count != '0' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      - name: Build workspace dependencies once
        run: npm run build --workspaces --if-present
      - name: Validate every selected package tarball
        env:
          PACKAGE_MATRIX: ${{ needs.select.outputs.matrix }}
        shell: bash
        run: |
          set -euo pipefail
          jq -r '.include[].name' <<< "$PACKAGE_MATRIX" | while IFS= read -r package; do
            echo "::group::Validate $package"
            npm pack --workspace "$package" --dry-run
            echo "::endgroup::"
          done

  release:
    name: GitHub package release
    needs: [select, gate]
    if: ${{ needs.select.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 1 # Avoid concurrent release/tag mutations and GitHub release-index races.
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    permissions:
      contents: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_release.yml@v0
    with:
      version: ${{ matrix.version }}
      release-tag: ${{ format('{0}@{1}', matrix.directory, matrix.version) }}
      release-name: ${{ format('{0} v{1}', matrix.name, matrix.version) }}
      changelog-file: ${{ format('{0}/CHANGELOG.md', matrix.directory) }}
      target-ref: main
      create-tag: true
      major-tag: ${{ format('{0}@v{1}', matrix.directory, matrix.major) }}
      update-major-tag: ${{ inputs.update-major-tag }}
      draft: ${{ inputs.draft }}
      dry-run: ${{ inputs.dry-run }}
