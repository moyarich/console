name: Release package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package name or package directory
        required: true
        type: string
      dry-run:
        description: Validate without creating a GitHub Release, tag, or package
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-package-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  select:
    name: Resolve package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.package.outputs.name }}
      directory: ${{ steps.package.outputs.directory }}
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
      release-name: ${{ steps.package.outputs.release-name }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve package
        id: package
        env:
          SELECTOR: ${{ inputs.package }}
        shell: bash
        run: |
          set -euo pipefail

          SELECTOR="$SELECTOR" node --input-type=module <<'NODE' > /tmp/package.json
          import fs from "node:fs";
          import path from "node:path";

          function walk(directory) {
            return fs.readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const target = path.join(directory, entry.name);
              if (entry.isDirectory()) return walk(target);
              return entry.name === "package.json" ? [target] : [];
            });
          }

          const packages = walk("packages")
            .map((manifestPath) => {
              const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
              return {
                name: manifest.name,
                version: manifest.version,
                directory: path.dirname(manifestPath).replaceAll("\\", "/"),
                private: manifest.private === true,
              };
            })
            .filter((pkg) => pkg.name && pkg.version && !pkg.private);

          const selected = packages.filter(
            (pkg) => pkg.name === process.env.SELECTOR || pkg.directory === process.env.SELECTOR,
          );

          if (selected.length !== 1) {
            console.error(`Expected exactly one package for selector "${process.env.SELECTOR}", found ${selected.length}.`);
            process.exit(1);
          }

          process.stdout.write(JSON.stringify(selected[0]));
          NODE

          RESULT="$(cat /tmp/package.json)"

          NAME="$(jq -r '.name' <<< "$RESULT")"
          DIRECTORY="$(jq -r '.directory' <<< "$RESULT")"
          VERSION="$(jq -r '.version' <<< "$RESULT")"
          TAG="$DIRECTORY@$VERSION"
          RELEASE_NAME="$NAME v$VERSION"

          {
            echo "name=$NAME"
            echo "directory=$DIRECTORY"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "release-name=$RELEASE_NAME"
          } >> "$GITHUB_OUTPUT"

  gate:
    name: Validate package release
    needs: select
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=optional
      - run: npm run lint && npm run format:check && npm run typecheck && npm test
      - name: Build and pack selected package
        env:
          PACKAGE_NAME: ${{ needs.select.outputs.name }}
        run: |
          npm run build --workspace "$PACKAGE_NAME"
          npm pack --workspace "$PACKAGE_NAME" --dry-run

  release:
    name: GitHub package release
    needs: [select, gate]
    permissions:
      contents: write
    uses: moyarich/reusable-workflows/.github/workflows/reusable_release.yml@v0
    with:
      version: ${{ needs.select.outputs.version }}
      release-tag: ${{ needs.select.outputs.tag }}
      release-name: ${{ needs.select.outputs.release-name }}
      changelog-file: ${{ format('{0}/CHANGELOG.md', needs.select.outputs.directory) }}
      target-ref: main
      create-tag: true
      draft: false
      dry-run: ${{ inputs.dry-run }}

