name: Self-heal

on:
  push:
    branches-ignore:
      - main
    paths:
      - "package.json"
      - "packages/**/package.json"
      - "apps/**/package.json"
  workflow_dispatch:
    inputs:
      repair:
        description: Repair to run
        type: choice
        required: true
        default: all
        options:
          - all
          - package-lock
          - prettier
      commit:
        description: Commit repaired files
        type: boolean
        default: true

permissions:
  contents: write
  packages: read

concurrency:
  group: self-heal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-lock:
    if: >-
      ${{ github.actor != 'github-actions[bot]' &&
          (github.event_name == 'push' || inputs.repair != 'prettier') }}
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-package-lock.yml@main
    with:
      node-version: "24"
      commit: ${{ github.event_name == 'push' || inputs.commit }}

  prettier:
    needs: package-lock
    if: >-
      ${{ always() && github.actor != 'github-actions[bot]' &&
          (needs.package-lock.result == 'success' || needs.package-lock.result == 'skipped') &&
          (github.event_name == 'push' || inputs.repair != 'package-lock') }}
    uses: moyarich/reusable-workflows/.github/workflows/reusable_prettier.yml@main
    with:
      mode: fix
      prettier-config: this-repository
      commit: ${{ github.event_name == 'push' || inputs.commit }}
      node-version: "24"

  summarize:
    name: Self-heal summary
    needs: [package-lock, prettier]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report results
        env:
          LOCK_RESULT: ${{ needs.package-lock.result }}
          FORMAT_RESULT: ${{ needs.prettier.result }}
        run: |
          echo "## Self-heal" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repair | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package lock | $LOCK_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Prettier | $FORMAT_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$LOCK_RESULT" == failure || "$FORMAT_RESULT" == failure ]]; then
            exit 1
          fi
