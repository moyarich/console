name: Self-heal package lock

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Commit package-lock.json changes
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: read

concurrency:
  group: self-heal-package-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-lock:
    if: ${{ github.actor != 'github-actions[bot]' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    uses: moyarich/reusable-workflows/.github/workflows/reusable_npm-package-lock.yml@main
    with:
      node-version: "24"
      commit: ${{ github.event_name == 'workflow_run' || inputs.commit }}
