name: Self-heal package lock

on:
  push:
    branches-ignore:
      - main
    paths:
      - "package.json"
      - "packages/**/package.json"
      - "apps/**/package.json"
  workflow_dispatch:
    inputs:
      commit:
        description: Commit package-lock.json changes
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: read

concurrency:
  group: self-heal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"

      - name: Recreate package-lock.json
        id: lock
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm install             --package-lock-only             --ignore-scripts             --no-audit             --no-fund

          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate recreated lockfile
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile repair
        if: >-
          ${{ steps.lock.outputs.changed == 'true' &&
              (github.event_name == 'push' || inputs.commit) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: self-heal package-lock.json"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Summary
        if: ${{ always() }}
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          CHANGES_DETECTED: ${{ steps.lock.outputs.changed || 'unknown' }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "# Self-heal package lock"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Branch | `%s` |\n' "$BRANCH_NAME"
            printf '| Changes detected | **%s** |\n' "$CHANGES_DETECTED"
            printf '| Result | **%s** |\n' "$RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
