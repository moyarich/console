name: Storybook localization browser tests

on:
  pull_request:
    paths:
      - ".storybook/**"
      - "stories/**"
      - "packages/**"
      - "tests/storybook/**"
      - "playwright.storybook.config.ts"
      - "package*.json"
      - ".github/workflows/storybook-localization.yml"
  push:
    branches: [main]
    paths:
      - ".storybook/**"
      - "stories/**"
      - "packages/**"
      - "tests/storybook/**"
      - "playwright.storybook.config.ts"
      - "package*.json"
      - ".github/workflows/storybook-localization.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  localization:
    name: Storybook / localization Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"
      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Run Storybook localization tests
        run: npx playwright test --config playwright.storybook.config.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-localization-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
