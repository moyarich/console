name: Deploy playground and Storybook to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/playground/**"
      - "packages/**"
      - "docs/**"
      - "examples/**"
      - ".github/workflows/pages-n-storybook.yml"
      - ".storybook/**"
      - "stories/**"
      - "scripts/build-pages.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_github-pages.yml@main
    with:
      node-version: "24"
      build-command: npm run build:pages
      output-directory: dist/pages
    secrets: inherit
