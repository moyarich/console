name: CI / npm package lint
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/ci_npm-package-lint.yml"
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/ci_npm-package-lint.yml"
  workflow_dispatch:
    inputs:
      show-input-summary:
        description: Show workflow input parameters
        type: boolean
        default: true
      checkout-sha:
        description: Exact commit SHA to validate
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  workflow-call-input-summary:
    name: "job: Reusable workflow parameters"
    if: ${{ inputs.show-input-summary && github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_dispatch-input-summary.yml@main
    with:
      parameters-json: ${{ toJSON(inputs) }}
      exclude-inputs: '["show-input-summary"]'
      heading: "Workflow inputs"

  npm-package-lint:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_ci_npm-package-lint.yml@main
    with:
      checkout-sha: ${{ inputs.checkout-sha }}
      expected-author: "Moya Richards"
