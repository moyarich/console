name: Format console enhancements

on:
  push:
    branches:
      - feature/console-enhancements

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --include=optional
      - name: Format changed feature files
        run: |
          npx prettier --write \
            packages/console/src/components/Console.tsx \
            packages/console/src/components/ConsoleStdout.tsx \
            packages/console/src/utils/ansi.ts \
            README.md
      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/format-console-enhancements.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format remaining console enhancements"
          git push origin HEAD:feature/console-enhancements
