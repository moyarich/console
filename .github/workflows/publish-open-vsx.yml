name: Package and publish CSS color extension

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated VSIX to Open VSX
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm test --workspace @moyarich/vscode-visualize-css-colors
      - run: npm run package --workspace @moyarich/vscode-visualize-css-colors
      - name: Save the installable extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visualize-css-colors-vsix
          path: packages/visualize-css-colors/vscode-visualize-css-colors/artifacts/*.vsix
          if-no-files-found: error
      - name: Publish the validated package
        if: ${{ inputs.publish }}
        working-directory: packages/visualize-css-colors/vscode-visualize-css-colors
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: node scripts/publish-extension.mjs
