name: Reset Release

run-name: >-
  Reset release · ${{ inputs.package }} · dry-run=${{ inputs.dry-run }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package selector: all, package name, or directory"
        required: true
        default: all
        type: string
      target-branch:
        description: Release target branch
        required: true
        default: main
        type: string
      match-mode:
        description: Find release by package version or exact tag
        required: true
        default: package-json
        type: choice
        options:
          - package-json
          - exact
      exact-tag:
        description: Existing canonical release tag when match-mode is exact
        required: false
        default: ""
        type: string
      dry-run:
        description: Preview the reset without mutating the release or tag
        required: true
        default: true
        type: boolean

permissions: {}

jobs:
  discover:
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_discover-packages.yml@main
    with:
      packages-directory: packages
      use-workspaces: true
      require-publish-config: true

  select:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select packages
        id: select
        env:
          SELECTOR: ${{ inputs.package }}
          PACKAGES_JSON: ${{ needs.discover.outputs.packages }}
          MATCH_MODE: ${{ inputs.match-mode }}
          EXACT_TAG: ${{ inputs.exact-tag }}
          RESTORE_SOURCE: ${{ inputs.restore-source || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SELECTOR" = all ]; then
            SELECTED="$PACKAGES_JSON"
          else
            SELECTED="$(jq -cn --argjson packages "$PACKAGES_JSON" --arg selector "$SELECTOR" '[ $packages[] | select(.directory == $selector or .name == $selector) ]')"
          fi
          COUNT="$(jq 'length' <<< "$SELECTED")"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Unknown package selector: $SELECTOR"
            exit 1
          fi
          if [ "$MATCH_MODE" = exact ] && [ "$COUNT" -eq 1 ] && [ -z "$EXACT_TAG" ]; then
            echo "::error::exact-tag is required in exact mode."
            exit 1
          fi
          if [ "$SELECTOR" = all ] && [ -n "$RESTORE_SOURCE" ]; then
            case "$RESTORE_SOURCE" in
              commit:*|run:*) ;;
              *) echo "::error::Bulk restore requires a shared commit:<sha> or run:<id> source."; exit 1 ;;
            esac
          fi
          echo "matrix=$(jq -cn --argjson packages "$SELECTED" '{include: $packages}')" >> "$GITHUB_OUTPUT"
          {
            echo "# Reset release selection"
            echo
            echo "$COUNT package(s) selected. Dry run: ${{ inputs.dry-run }}."
            jq -r '.[] | "- " + .name + " (" + .directory + "@" + .version + ")"' <<< "$SELECTED"
          } >> "$GITHUB_STEP_SUMMARY"

  reset:
    name: "Reset · ${{ matrix.name }}"
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    concurrency:
      group: reset-release-${{ github.repository }}-${{ matrix.directory }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      packages: read
      pull-requests: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_reset-release.yml@main
    with:
      draft-template-path: .github/release-drafter-template.yml
      package: ${{ matrix.directory }}
      target-branch: ${{ inputs.target-branch }}
      match-mode: exact
      exact-tag: ${{ inputs.match-mode == 'exact' && inputs.exact-tag != '' && inputs.package != 'all' && inputs.exact-tag || format('{0}@{1}', matrix.directory, matrix.version) }}
      dry-run: ${{ inputs.dry-run }}
